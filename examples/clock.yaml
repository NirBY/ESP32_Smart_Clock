# One-time setup in ESPHome Device Builder. Keep credentials in its secrets.yaml.
substitutions:
  device_name: esp32-smart-clock
  friendly_name: ESP32 Smart Clock
  smart_clock_release: "v0.1.0-beta.19" # Managed by the HA updater; keep this line.
  api_encryption_key: !secret api_encryption_key
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  fallback_ap_password: !secret fallback_ap_password

packages:
  clock:
    url: https://github.com/NirBY/ESP32_Smart_Clock
    ref: ${smart_clock_release}
    files: [packages/smart-clock.yaml]
    refresh: 0s

# Put your local overrides below. The updater only changes smart_clock_release.
