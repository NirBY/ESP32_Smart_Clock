services:
  clock-builder:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      ESPHOME_USERNAME: ${ESPHOME_USERNAME:-clock-builder}
      ESPHOME_PASSWORD: ${ESPHOME_PASSWORD:?Set a private builder password in .env}
    volumes:
      - ./config:/config
      - builder-cache:/root/.cache
volumes:
  builder-cache:
