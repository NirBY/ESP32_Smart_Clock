blueprint:
  name: ESP32 Smart Clock GitHub Firmware Update Check
  description: >
    Refresh the ESP32 Smart Clock GitHub release-backed update entity. By
    default this only creates a notification, because public GitHub release
    firmware does not include your local secrets.yaml or local YAML edits. Enable
    install only when you intentionally want to flash the public release binary.
  domain: automation
  input:
    firmware_update_entity:
      name: Firmware update entity
      description: Select the ESP32 Smart Clock Firmware Update entity.
      selector:
        entity:
          domain: update
    update_time:
      name: Update check time
      description: Time of day to check GitHub releases.
      default: "03:15:00"
      selector:
        time:
    install_update:
      name: Install public GitHub firmware automatically
      description: >
        Leave off for normal personalized clocks. Turn on only if you understand
        that the public release binary is not compiled with your local
        secrets.yaml or local YAML edits.
      default: false
      selector:
        boolean:

mode: single

trigger:
  - platform: time
    at: !input update_time

variables:
  install_update: !input install_update
  firmware_entity: !input firmware_update_entity

action:
  - service: homeassistant.update_entity
    target:
      entity_id: !input firmware_update_entity
  - delay: "00:00:10"
  - condition: template
    value_template: >-
      {% set installed = state_attr(firmware_entity, 'installed_version') or '' %}
      {% set latest = state_attr(firmware_entity, 'latest_version') or '' %}
      {% set base = installed | regex_replace('-dev[.][0-9]+$', '') %}
      {% set valid = '^[0-9]+[.][0-9]+[.][0-9]+(-beta[.][0-9]+)?$' %}
      {{ states(firmware_entity) not in ['unknown', 'unavailable'] and
         ((latest is match(valid) and base is match(valid) and
           ((version(latest) > version(base)) or
            (latest == base and installed != base))) or
          is_state(firmware_entity, 'on')) }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ install_update and is_state(firmware_entity, 'on') }}"
        sequence:
          - service: update.install
            target:
              entity_id: !input firmware_update_entity
    default:
      - service: persistent_notification.create
        data:
          title: ESP32 Smart Clock firmware update
          notification_id: "esp32_clock_update_{{ firmware_entity }}"
          message: >-
            New firmware {{ state_attr(firmware_entity, 'latest_version') }} is available.
            Installed: {{ state_attr(firmware_entity, 'installed_version') }}.
            [Open firmware update panel](/config/updates?more-info-entity-id={{ firmware_entity }}&more-info-view=info).
            [Release notes]({{ state_attr(firmware_entity, 'release_url') }}).
            Update your personalized clock from its local ESPHome YAML to preserve
            credentials and settings. If HA shows Up-to-date for a development
            build, a one-time personalized firmware update is needed.
