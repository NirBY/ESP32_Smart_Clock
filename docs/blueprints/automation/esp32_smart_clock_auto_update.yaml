blueprint:
  name: ESP32 Smart Clock GitHub Firmware Update Check
  description: >
    Check GitHub firmware releases and show a notification. Select the optional
    Personalized firmware entity from ESP32 Smart Clock Updates to open HA's
    Install control. Installation builds locally with your saved configuration.
  domain: automation
  input:
    firmware_update_entity:
      name: Firmware update entity
      description: Select the ESP32 Smart Clock Firmware Update entity.
      selector:
        entity:
          domain: update
    update_time:
      name: Update check time
      description: Time of day to check GitHub releases.
      default: "03:15:00"
      selector:
        time:
    install_update:
      name: Install personalized firmware automatically
      description: >
        Requires the Personalized firmware entity below. Leave off to choose
        when to install from the notification. Public binaries are never installed.
      default: false
      selector:
        boolean:
    install_entity:
      name: Personalized firmware entity (optional)
      description: Set up ESP32 Smart Clock Updates, then select its Personalized firmware entity.
      default: ""
      selector:
        entity:
          domain: update
          integration: esp32_smart_clock

mode: single

trigger:
  - platform: time
    at: !input update_time

variables:
  install_update: !input install_update
  firmware_entity: !input firmware_update_entity
  install_entity: !input install_entity

action:
  - service: homeassistant.update_entity
    target:
      entity_id: !input firmware_update_entity
  - delay: "00:00:10"
  - condition: template
    value_template: >-
      {% set installed = state_attr(firmware_entity, 'installed_version') or '' %}
      {% set latest = state_attr(firmware_entity, 'latest_version') or '' %}
      {% set base = installed | regex_replace('-dev[.][0-9]+$', '') %}
      {% set valid = '^[0-9]+[.][0-9]+[.][0-9]+(-beta[.][0-9]+)?$' %}
      {{ states(firmware_entity) not in ['unknown', 'unavailable'] and
         ((latest is match(valid) and base is match(valid) and
           ((version(latest) > version(base)) or
            (latest == base and installed != base))) or
          is_state(firmware_entity, 'on')) }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ install_update and install_entity != '' and is_state(install_entity, 'on') }}"
        sequence:
          - service: update.install
            target:
              entity_id: !input install_entity
    default:
      - service: persistent_notification.create
        data:
          title: ESP32 Smart Clock firmware update
          notification_id: "esp32_clock_update_{{ firmware_entity }}"
          message: >-
            New firmware {{ state_attr(firmware_entity, 'latest_version') }} is available.
            Installed: {{ state_attr(firmware_entity, 'installed_version') }}.
            [Release notes]({{ state_attr(firmware_entity, 'release_url') }}).
            {% if install_entity != '' %}
            [Review and install](/config/updates?more-info-entity-id={{ install_entity }}&more-info-view=info).
            Your local ESPHome builder preserves your credentials and settings.
            {% else %}
            [Set up one-click updates](https://github.com/NirBY/ESP32_Smart_Clock/blob/main/docs/wiki/One-Click-Updates.md).
            Existing personalized clocks can also update from their local ESPHome YAML.
            {% endif %}
