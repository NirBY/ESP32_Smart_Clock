name: Home Assistant updater tests
on:
  push:
    paths: ['custom_components/**', 'components/**', 'packages/**', 'examples/**', 'tests/test_builder.py', 'tests/test_ha_update.py', '.github/workflows/ha-updater-tests.yml']
  pull_request:
    paths: ['custom_components/**', 'components/**', 'packages/**', 'examples/**', 'tests/test_builder.py', 'tests/test_ha_update.py', '.github/workflows/ha-updater-tests.yml']
permissions:
  contents: read
jobs:
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install aiohttp
      - run: python tests/test_builder.py
      - name: Check generated remote package stays in sync
        run: |
          python tools/generate_remote_package.py
          git diff --exit-code -- packages components
      - name: Validate portable ESPHome package before its release tag exists
        run: |
          python -m pip install "esphome==$(cat ESPHOME_VERSION)"
          python tools/prepare_package_check.py
          esphome config outputs/package-check/check.yaml
      - name: Test native entity and setup against official Home Assistant
        run: docker run --rm -v "$PWD:/work" -w /work --entrypoint python ghcr.io/home-assistant/home-assistant:stable tests/test_ha_update.py
