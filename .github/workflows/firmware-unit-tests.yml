name: Firmware unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  timer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/clock_timer_test.cpp -o /tmp/clock_timer_test && /tmp/clock_timer_test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/alarm_schedule_test.cpp -o /tmp/alarm_schedule_test && /tmp/alarm_schedule_test
      - run: python -m pip install PyYAML Jinja2 awesomeversion pyserial
      - run: python tests/update_notification_test.py
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/firmware_version_test.cpp -o /tmp/firmware_version_test && /tmp/firmware_version_test
      - run: python tests/firmware_version_ha_test.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/brightness_schedule_test.cpp -o /tmp/brightness_test && /tmp/brightness_test
      - run: node tests/brightness_card_test.cjs
      - run: python tests/desktop_installer_test.py
