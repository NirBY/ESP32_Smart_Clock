name: Build and Release Firmware

on:
  push:
    tags:
      - "v*"
      - "V*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to create after a successful build, for example v0.1.1-beta.1"
        required: false
        type: string
      prerelease:
        description: "Mark a manually created release as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-source:
    name: Verify combined source changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install PyYAML Jinja2 awesomeversion pyserial
      - run: |
          set -euo pipefail
          for source in tests/*_test.cpp; do
            g++ -std=c++17 -Wall -Wextra -Werror "$source" -o /tmp/clock-test
            /tmp/clock-test
          done
          python tests/update_notification_test.py
          python tests/firmware_version_ha_test.py
          python tests/desktop_installer_test.py
          python tests/package_sources_test.py
          node tests/brightness_card_test.cjs

  build-macos-dmg:
    name: Build universal macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Match firmware to release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag || '' }}
          TAG_REF: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['INPUT_TAG'] or os.environ['TAG_REF']
          if tag:
              value = tag.lstrip('vV')
              if not re.fullmatch(r'\d+\.\d+\.\d+(?:-beta\.\d+)?', value):
                  raise SystemExit('Unsupported firmware release version')
              path = Path('esphome-smart-clock.yaml')
              text = re.sub(r'(?m)^(  firmware_version:)\s*"[^"]+"', lambda m: m[1] + ' "' + value + '"', path.read_text(encoding='utf-8'), count=1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Create and verify universal DMG
        run: python desktop/build_macos_dmg.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer-dmg
          path: |
            outputs/desktop-release/SmartClock-macOS.dmg
            outputs/desktop-release/SmartClock-macOS.sha256
          if-no-files-found: error

  build-desktop:
    name: Desktop ${{ matrix.platform }}
    needs: build-macos-dmg
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: Windows-x64
          - runner: macos-15
            platform: macOS-AppleSilicon
          - runner: macos-15-intel
            platform: macOS-Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Match firmware to release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag || '' }}
          TAG_REF: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['INPUT_TAG'] or os.environ['TAG_REF']
          if tag:
              value = tag.lstrip('vV')
              if not re.fullmatch(r'\d+\.\d+\.\d+(?:-beta\.\d+)?', value):
                  raise SystemExit('Unsupported firmware release version')
              path = Path('esphome-smart-clock.yaml')
              text = re.sub(r'(?m)^(  firmware_version:)\s*"[^"]+"', lambda m: m[1] + ' "' + value + '"', path.read_text(encoding='utf-8'), count=1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Build isolated Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv outputs/desktop-build-env
          $python = (Resolve-Path outputs/desktop-build-env/Scripts/python.exe).Path
          $version = (Get-Content ESPHOME_VERSION -Raw).Trim()
          & $python -m pip install "esphome==$version"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python desktop/build_windows.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python tests/desktop_installer_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python tests/web_installer_download_test.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python desktop/verify_windows.py --compile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Download universal macOS disk image
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: macos-installer-dmg
          path: outputs/desktop-release
      - name: Verify macOS DMG on the native architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python desktop/verify_macos_online.py
      - name: Archive standalone package
        if: runner.os == 'Windows'
        shell: bash
        env:
          DESKTOP_PLATFORM: ${{ matrix.platform }}
          DESKTOP_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            outputs/desktop-build-env/Scripts/python.exe desktop/package.py
          else
            python desktop/package.py
          fi
      - name: Reject stale Windows app or firmware in installer
        if: runner.os == 'Windows'
        run: outputs/desktop-build-env/Scripts/python.exe desktop/verify_package_sources.py
      - name: Verify the online installer and offline recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          outputs/desktop-build-env/Scripts/python.exe desktop/verify_web_installer.py --compile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: outputs/desktop-release/*
          if-no-files-found: error

  build-release:
    name: Build firmware
    needs: [build-desktop, verify-source]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          release_tag="${RELEASE_EVENT_TAG}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_RELEASE_TAG}" ]; then
            release_tag="${INPUT_RELEASE_TAG}"
          elif [[ "${REF}" == refs/tags/* ]]; then
            release_tag="${REF_NAME}"
          fi

          firmware_version="${release_tag}"
          firmware_version="${firmware_version#v}"
          firmware_version="${firmware_version#V}"

          if [ -z "${firmware_version}" ]; then
            firmware_version="$(grep -E '^[[:space:]]*firmware_version:' esphome-smart-clock.yaml | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          fi

          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "FIRMWARE_VERSION=${firmware_version}" >> "${GITHUB_ENV}"
          echo "Resolved release tag: ${release_tag:-none}"
          echo "Resolved firmware version: ${firmware_version}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "esphome==$(tr -d '[:space:]' < ESPHOME_VERSION)"

      - name: Install isolated Arduino build tools
        run: |
          python -m venv "$RUNNER_TEMP/platformio"
          "$RUNNER_TEMP/platformio/bin/python" -m pip install "platformio==6.2.0"
          echo "ARDUINO_PIO=$RUNNER_TEMP/platformio/bin/pio" >> "$GITHUB_ENV"

      - name: Prepare ESPHome CI secrets
        run: cp secrets.example.yaml secrets.yaml

      - name: Use CI-local ESPHome build path
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("esphome-smart-clock.yaml")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "build_path: C:/Users/nirbe/.esphome/build/${device_name}",
              "build_path: build/${device_name}",
          )
          firmware_version = os.environ["FIRMWARE_VERSION"]
          text = re.sub(
              r'(^\s*firmware_version:\s*)".*?"',
              rf'\g<1>"{firmware_version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate ESPHome config
        run: esphome config esphome-smart-clock.yaml

      - name: Compile ESPHome smart clock firmware
        run: esphome compile esphome-smart-clock.yaml

      - name: Build PlatformIO hardware test firmware
        run: |
          "$ARDUINO_PIO" run -e esp32dev

      - name: Build PlatformIO Bluetooth speaker firmware
        run: |
          "$ARDUINO_PIO" run -e bluetooth_speaker

      - name: Collect firmware artifacts
        run: |
          mkdir -p release
          esphome_build_dir=""
          for candidate in \
            "build/esp32-smart-clock/build" \
            ".esphome/build/esp32-smart-clock/build" \
            "build/esp32-smart-clock/.pioenvs/esp32-smart-clock" \
            ".esphome/build/esp32-smart-clock/.pioenvs/esp32-smart-clock"
          do
            if [ -f "${candidate}/firmware.factory.bin" ] && [ -f "${candidate}/firmware.ota.bin" ]; then
              esphome_build_dir="${candidate}"
              break
            fi
          done

          if [ -z "${esphome_build_dir}" ]; then
            echo "ESPHome firmware artifacts were not found."
            echo "Known build directories:"
            find build .esphome -maxdepth 5 -type f -name 'firmware*.bin' -print 2>/dev/null || true
            exit 1
          fi

          cp "${esphome_build_dir}/firmware.factory.bin" release/esphome-smart-clock.factory.bin
          cp "${esphome_build_dir}/firmware.ota.bin" release/esphome-smart-clock.ota.bin
          cp .pio/build/esp32dev/firmware.bin release/platformio-hardware-test.bin
          cp .pio/build/bluetooth_speaker/firmware.bin release/bluetooth-speaker.bin

          ota_md5="$(md5sum release/esphome-smart-clock.ota.bin | awk '{print $1}')"
          printf '%s\n' "${ota_md5}" > release/esphome-smart-clock.ota.md5

          ota_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/firmware-latest/esphome-smart-clock.ota.bin"
          if [ -n "${RELEASE_TAG}" ]; then
            release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          else
            release_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          fi
          export ota_url release_url

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          md5 = Path("release/esphome-smart-clock.ota.md5").read_text(encoding="utf-8").strip()
          manifest = {
              "name": "ESP32 Smart Clock",
              "version": os.environ["FIRMWARE_VERSION"],
              "builds": [
                  {
                      "chipFamily": "ESP32",
                      "ota": {
                          "md5": md5,
                          "path": os.environ["ota_url"],
                          "release_url": os.environ["release_url"],
                          "summary": f"ESP32 Smart Clock {os.environ['FIRMWARE_VERSION']}",
                      },
                  }
              ],
          }
          Path("release/firmware-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create manual release tag after successful build
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="${{ github.sha }}"

      - name: Collect desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Record release provenance and asset checksums
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          notes = Path('docs/releases/v' + os.environ['FIRMWARE_VERSION'] + '.md')
          Path('outputs').mkdir(exist_ok=True)
          Path('outputs/release-notes.md').write_text(notes.read_text() if notes.exists() else 'Smart Clock ' + os.environ['FIRMWARE_VERSION'])
          folder = Path('release')
          assets = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(folder.iterdir()) if p.is_file()}
          manifest = dict(commit=os.environ['GITHUB_SHA'], version=os.environ['FIRMWARE_VERSION'], assets=assets)
          (folder / 'release-provenance.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: release/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          body_path: outputs/release-notes.md
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          prerelease: ${{ (github.event_name == 'release' && github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(github.ref_name, '-') }}
          files: release/*

      - name: Publish Home Assistant firmware update channel
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          UPDATE_BRANCH: firmware-latest
        run: |
          set -euo pipefail

          mkdir -p update-channel
          cp release/esphome-smart-clock.ota.bin update-channel/esphome-smart-clock.ota.bin
          cp release/esphome-smart-clock.ota.md5 update-channel/esphome-smart-clock.ota.md5
          cp release/firmware-manifest.json update-channel/firmware-manifest.json
          printf '%s\n' "${FIRMWARE_VERSION}" > update-channel/VERSION

          git -C update-channel init
          git -C update-channel config user.name "github-actions[bot]"
          git -C update-channel config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C update-channel checkout -B "${UPDATE_BRANCH}"
          git -C update-channel add .
          git -C update-channel commit -m "Publish firmware ${FIRMWARE_VERSION}"
          git -C update-channel push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "${UPDATE_BRANCH}"
